name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Audit des dépendances de production
        run: npm audit --omit=dev
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests automatiques
        run: npm test
      - name: Build de production
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
